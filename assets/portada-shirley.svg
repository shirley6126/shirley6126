<!-- pixel Ecuador flag ribbon -->
<g><rect x="20" y="356" width="1160" height="22" fill="#ffd447"/><rect x="20" y="378" width="1160" height="16" fill="#2868c7"/><rect x="20" y="394" width="1160" height="16" fill="#e65b70"/></g>
<!-- pixel condor silhouette -->
<g fill="#11101c"><rect x="656" y="112" width="28" height="14"/><rect x="632" y="126" width="76" height="14"/><rect x="606" y="140" width="126" height="14"/><rect x="588" y="154" width="158" height="14"/><rect x="612" y="168" width="112" height="14"/><rect x="646" y="182" width="56" height="28"/><rect x="662" y="210" width="24" height="20"/><rect x="684" y="214" width="18" height="8" fill="#ffd447"/></g>
<!-- pixel cloud accents -->
<g fill="#b88be8"><rect x="74" y="268" width="56" height="12"/><rect x="92" y="256" width="24" height="12"/><rect x="1014" y="268" width="74" height="12"/><rect x="1030" y="256" width="38" height="12"/></g>
