<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Shirley Amaguaña — Ecuador pixel art</title><desc id="desc">Paisaje pixel art al atardecer con Cotopaxi, un cóndor y los colores de la bandera ecuatoriana.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#17142d"/><stop offset=".65" stop-color="#33204f"/><stop offset="1" stop-color="#68416c"/></linearGradient></defs>
<rect width="1200" height="460" fill="#100e20"/><rect x="14" y="14" width="1172" height="432" fill="url(#sky)" stroke="#a77be8" stroke-width="5"/>
<!-- pixel stars -->
<g fill="#ffe08a"><path d="M92 83h12v12h12v12h-12v12H92v-12H80V95h12z"/><path d="M1080 70h10v10h10v10h-10v10h-10V90h-10V80h10z"/><rect x="924" y="121" width="8" height="8"/><rect x="160" y="155" width="7" height="7"/><rect x="740" y="78" width="8" height="8"/></g>
<!-- pixel sun -->
<g fill="#f2a6c8"><rect x="880" y="150" width="64" height="16"/><rect x="864" y="166" width="96" height="48"/><rect x="880" y="214" width="64" height="16"/></g>
<!-- distant Andes -->
<path fill="#49305f" d="M20 310h110l70-72 46 42 82-112 79 92 72-52 104 104 86-79 92 82 67-66 93 79 74-61 104 65v75H20z"/>
<!-- Cotopaxi base and snow cap -->
<path fill="#704b86" d="M256 376l130-238 132 238z"/><path fill="#f4e8ff" d="M386 138l-42 77 28-9 14 22 15-23 31 9z"/><path fill="#c9a6ee" d="M386 138l-130 238h36l94-154 96 154h36z"/>
